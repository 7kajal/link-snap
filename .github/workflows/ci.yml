name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Typecheck & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # NativeWind's Babel plugins must resolve on a clean pnpm install.
      # Lint and typechecking do not exercise Metro's bundling pipeline.
      - name: Export Android bundle
        env:
          CI: 1
        run: pnpm exec expo export --platform android --clear --dump-sourcemap --dump-assetmap
